services:
  api:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT_HOST:-8080}:8080"
    environment:
      NODE_ENV: production
      DB_SERVER: ${DB_SERVER:?falta DB_SERVER en .env}
      DB_PORT: ${DB_PORT:-1433}
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      DB_NAME: ${DB_NAME:?falta DB_NAME en .env}
      DB_MAX_CONEXIONES: ${DB_MAX_CONEXIONES:-5}
      API_HOST: 0.0.0.0
      API_PUERTO: 8080
      APP_ORIGEN_FRONTEND: ${APP_ORIGEN_FRONTEND:-}
      APP_URL_PUBLICA: ${APP_URL_PUBLICA:-}
      API_COOKIE_SEGURA: ${API_COOKIE_SEGURA:-true}
      API_COOKIE_SAMESITE: ${API_COOKIE_SAMESITE:-}
      API_MIGRAR_AL_INICIAR: "false"
      API_DIR_ADJUNTOS: /datos/adjuntos
    volumes:
      - adjuntos:/datos/adjuntos

volumes:
  adjuntos:
    name: controlhorario_adjuntos
